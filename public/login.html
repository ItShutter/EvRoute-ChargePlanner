<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - EV Route Planner</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            margin: 0; padding: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            /* ภาพพื้นหลังสถานีชาร์จ EV พร้อมฟิลเตอร์มืดลงเพื่อให้ตัวหนังสือเด่นขึ้น */
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.6)), 
                        url('https://images.unsplash.com/photo-1593941707882-a5bba14938c7?q=80&w=1920&auto=format&fit=crop](https://images.unsplash.com/photo-1593941707882-a5bba14938c7?q=80&w=1920&auto=format&fit=crop)') no-repeat center center fixed;
            background-size: cover;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            padding: 35px 30px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .login-card h2 {
            margin-bottom: 25px;
            color: #1f2937;
            font-size: 24px;
        }
        .form-group {
            text-align: left;
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #4b5563;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
        }
        .form-group input:focus {
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
        }
        .btn-submit {
            background: #10b981;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.1s ease;
            margin-top: 10px;
        }
        .btn-submit:hover { background: #059669; }
        .btn-submit:active { transform: scale(0.98); }
        .footer-link {
            margin-top: 20px;
            font-size: 14px;
            color: #6b7280;
        }
        .footer-link a {
            color: #10b981;
            text-decoration: none;
            font-weight: bold;
        }
        .footer-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>⚡ เข้าสู่ระบบ EV Planner</h2>
        
        <!-- ฟอร์มล็อกอินของคุณ -->
        <form id="loginForm">
            <div class="form-group">
                <label>ชื่อผู้ใช้งาน (Username):</label>
                <input type="text" id="username" placeholder="กรอกชื่อผู้ใช้งาน" required>
            </div>
            
            <div class="form-group">
                <label>รหัสผ่าน (Password):</label>
                <input type="password" id="password" placeholder="กรอกรหัสผ่าน" required>
            </div>
            
            <button type="submit" class="btn-submit">เข้าสู่ระบบ</button>
        </form>

        <div class="footer-link">
            ยังไม่มีบัญชีผู้ใช้? <a href="/register">สมัครสมาชิกที่นี่</a>
        </div>
    </div>

    <script>
        // โค้ดจัดการการส่งฟอร์มล็อกอินเดิมของคุณ (ถ้ามี สามารถวางต่อตรงนี้ได้เลย)
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();

                if (data.success) {
                    alert("เข้าสู่ระบบสำเร็จ!");
                    localStorage.setItem('currentUser', JSON.stringify(data.user));
                    
                    if (data.user.role === 'admin') {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'map.html';
                    }
                } else {
                    alert(data.message || "ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง");
                }
            } catch (err) {
                console.error(err);
                alert("เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์");
            }
        });
    </script>
</body>
</html>
