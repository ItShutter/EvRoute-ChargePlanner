<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV Route Planner - Main Map</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #map {
            width: 100vw;
            height: 100vh;
        }

        .marker-cluster-small,
        .marker-cluster-medium,
        .marker-cluster-large {
            background-color: rgba(16, 185, 129, 0.6);
        }

        .marker-cluster-small div,
        .marker-cluster-medium div,
        .marker-cluster-large div {
            background-color: rgba(16, 185, 129, 0.9);
            color: white;
            font-weight: bold;
        }

        /* 🔍 ช่องค้นหามุมซ้ายบน */
        #top-left-search {
            position: absolute;
            top: 20px;
            left: 65px;
            z-index: 1000;
            width: 280px;
        }

        .search-box {
            background: white;
            padding: 10px 14px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            display: flex;
            gap: 8px;
        }

        .search-box input {
            width: 100%;
            border: none;
            outline: none;
            font-size: 14px;
        }

        .search-btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }

        .search-btn:hover {
            background: #2563eb;
        }

        /* 📍 แผงควบคุมมุมขวาบน */
        #top-right-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 300px;
        }

        #user-profile-top {
            background: white;
            padding: 10px 16px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 14px;
        }

        .clickable-username {
            color: #3b82f6;
            cursor: pointer;
            text-decoration: none;
        }

        .clickable-username:hover {
            text-decoration: underline;
        }

        .logout-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        .logout-btn:hover {
            background: #dc2626;
        }

        #user-status {
            background: white;
            padding: 12px 16px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            border-left: 5px solid #10b981;
            cursor: pointer;
            transition: transform 0.2s;
        }

        #user-status:hover {
            transform: translateY(-2px);
        }

        #user-status h4 {
            margin: 0 0 4px 0;
            color: #1f2937;
            font-size: 14px;
        }

        #user-status p {
            margin: 0;
            font-size: 13px;
            color: #4b5563;
        }

        /* --- CSS สำหรับแผงสรุปเส้นทาง (ปรับเป็นกล่องมุมซ้ายล่าง) --- */
        .bottom-panel {
            position: absolute;
            bottom: 25px;       /* ยกลอยขึ้นจากขอบล่าง 25px */
            left: 25px;         /* ขยับให้ชิดซ้าย 25px */
            right: auto;        /* ยกเลิกการขยายเต็มจอ */
            width: 380px;       /* กำหนดความกว้างของกล่องให้พอดี */
            max-width: 90vw;    /* ป้องกันกล่องล้นในหน้าจอขนาดเล็ก */
            background: #ffffff;
            border-radius: 20px; /* ปรับมุมให้มนทั้ง 4 ด้าน */
            padding: 20px 25px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15); /* เพิ่มเงาให้กล่องลอยมีมิติ */
            z-index: 1000;
            max-height: 65vh;   /* จำกัดความสูง ถ้ารายการยาวเกินไปจะเกิด Scroll bar */
            overflow-y: auto;
            transition: transform 0.3s ease, opacity 0.3s ease;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* แอนิเมชันเวลาซ่อนกล่อง */
        .bottom-panel.hidden {
            transform: translateY(150%);
            opacity: 0;
        }

        .panel-header {
            text-align: center;
            margin-bottom: 15px;
        }

        .drag-handle {
            width: 50px;
            height: 5px;
            background: #d1d5db;
            border-radius: 5px;
            margin: 0 auto;
        }

        .summary-card {
            background: #1f2937;
            color: white;
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .summary-card h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
        }

        .summary-card p {
            font-size: 13px;
            color: #d1d5db;
            margin: 0 0 15px 0;
            line-height: 1.5;
        }

        .summary-stats {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #10b981;
        }

        .timeline {
            position: relative;
            padding-left: 20px;
            margin-bottom: 20px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 4px;
            top: 5px;
            bottom: 5px;
            width: 2px;
            background: #e5e7eb;
        }

        .timeline-item {
            position: relative;
            padding-bottom: 25px;
        }

        .timeline-item:last-child {
            padding-bottom: 0;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: -20px;
            top: 5px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #9ca3af;
            border: 2px solid white;
            box-shadow: 0 0 0 2px #e5e7eb;
        }

        .timeline-item.start::before {
            background: #3b82f6;
            box-shadow: 0 0 0 2px #bfdbfe;
        }

        .timeline-item.charge::before {
            background: #10b981;
            box-shadow: 0 0 0 2px #a7f3d0;
        }

        .timeline-item.end::before {
            background: #ef4444;
            box-shadow: 0 0 0 2px #fecaca;
        }

        .timeline-title {
            font-size: 14px;
            font-weight: bold;
            color: #374151;
            margin-bottom: 5px;
        }

        .timeline-desc {
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 8px;
        }

        .timeline-badge {
            display: inline-block;
            background: #ecfdf5;
            color: #059669;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            margin-right: 5px;
        }

        /* ปรับปุ่มนำทาง Google Maps ให้เล็กลงและจัดกึ่งกลาง */
            .google-map-btn-floating {
                position: relative; /* เปลี่ยนจาก sticky เป็น relative เพื่อให้อยู่ท้ายสุดของเนื้อหาปกติ */
                margin: 25px auto 5px auto; /* จัดกึ่งกลางอัตโนมัติ และดันระยะห่างด้านบน */
                background: #4285F4;
                color: white;
                border: none;
                padding: 10px 20px; /* ลดระยะขอบด้านในให้ปุ่มดูเพรียวขึ้น */
                border-radius: 25px; 
                cursor: pointer;
                font-size: 14px; /* ลดขนาดฟอนต์ลงเล็กน้อย */
                font-weight: bold;
                box-shadow: 0 4px 12px rgba(66, 133, 244, 0.3);
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                width: fit-content; /* 💡 จุดสำคัญ: สั่งให้ความกว้างปุ่มหดลงพอดีกับข้อความ */
                transition: all 0.2s ease;
            }

            .google-map-btn-floating:hover {
                background: #3367D6;
                transform: scale(1.05);
            }

        /* 📱 สำหรับหน้าจอมือถือ (ปรับให้กลับมาเป็นแบบ Drawer เต็มจอด้านล่างเหมือนเดิมเพื่อให้อ่านง่าย) */
            @media screen and (max-width: 768px) {
                .bottom-panel {
                    bottom: 0;
                    left: 0;
                    width: 100%;
                    max-width: 100%;
                    border-radius: 24px 24px 0 0;
                    max-height: 50vh;
                }
            }
        
            #route-summary-panel {
            /* ปรับพื้นหลังให้ไล่สีเขียวอ่อนๆ สบายตา สไตล์แอปยุคใหม่ */
            background: linear-gradient(135deg, #b6dffa 10%, #faf4bf 100%) !important;
            
            /* เพิ่มเงาบางๆ ด้านบนให้กล่องดูลอยแยกออกจากแผนที่ชัดเจนขึ้น */
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.08) !important;
        }
        
    </style>
</head>

<body>

    <!-- 🌍 พื้นที่แผนที่ -->
    <div id="map"></div>

    <!-- 🔍 ช่องค้นหามุมซ้ายบน -->
    <div id="top-left-search">
        <div class="search-box">
            <input type="text" id="search-input" placeholder="🔍 ค้นหาสถานที่, จุดหมาย..."
                onkeypress="handleSearchKey(event)">
            <button class="search-btn" onclick="searchLocation()">ค้นหา</button>
        </div>
    </div>

    <!-- 📍 แผงควบคุมมุมขวาบน -->
    <div id="top-right-panel">
        <div id="user-profile-top">
            <span>👤 <strong id="display-username" class="clickable-username"
                    onclick="goToProfile()">Guest</strong></span>
            <button class="logout-btn" onclick="logout()">ออกจากระบบ</button>
        </div>
        <div id="user-status" title="คลิกเพื่อแก้ไขข้อมูลรถ">
            <h4 id="status-car-name">🚗 กำลังโหลดข้อมูลรถ...</h4>
            <p>🔋 แบตเตอรี่ปัจจุบัน: <strong id="status-battery" style="color: #10b981;">--%</strong></p>
        </div>
    </div>

    <!-- 📋 แผงสรุปการเดินทาง (Bottom Panel) -->
    <div id="route-summary-panel" class="bottom-panel hidden">
        <div class="panel-header">
            <div class="drag-handle"></div>
        </div>
        <div class="summary-card">
            <h3>สรุปการเดินทาง</h3>
            <p id="summary-text">กำลังคำนวณเส้นทางและจุดแวะชาร์จ...</p>
            <div class="summary-stats">
                <span>🚗 ระยะทางรวม: <strong id="summary-dist">0 km</strong></span>
                <span>⏱️ เวลาเดินทาง: <strong id="summary-time">0 h</strong></span>
            </div>
        </div>
        <div class="timeline" id="route-timeline"></div>
        <button class="google-map-btn-floating" onclick="openGoogleMaps()">🚀 เริ่มนำทางด้วย Google Maps</button>
    </div>

    <!-- ⚙️ หน้าต่างป๊อปอัปสำหรับแก้ไขข้อมูลโปรไฟล์รถ -->
    <div id="profile-modal"
        style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); z-index: 2000; align-items: center; justify-content: center;">
        <div
            style="background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 350px; box-shadow: 0 10px 25px rgba(0,0,0,0.3);">
            <h3 style="margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 10px;">⚙️ ตั้งค่ารถและแบตเตอรี่
            </h3>
            <label style="display:block; margin-top:10px; font-weight:bold; font-size: 13px;">ยี่ห้อรถ (Brand):</label>
            <select id="edit-brand"
                style="width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;">
                <option value="">-- เลือกยี่ห้อรถ --</option>
            </select>
            
            <label style="display:block; margin-top:10px; font-weight:bold; font-size: 13px;">รุ่นรถ (Model):</label>
            <select id="edit-model"
                style="width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;">
                <option value="">-- เลือกรุ่นรถ --</option>
            </select>
            <label style="display:block; margin-top:10px; font-weight:bold; font-size: 13px;">ระยะทางสูงสุด
                (กม.):</label>
            <input type="number" id="edit-range" readonly
                style="width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;">
            <label style="display:block; margin-top:10px; font-weight:bold; font-size: 13px;">แบตเตอรี่ปัจจุบัน
                (%):</label>
            <input type="number" id="edit-battery"
                style="width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;"
                min="1" max="100">
            <div style="display: flex; justify-content: space-between; margin-top: 20px;">
                <button onclick="closeProfileModal()"
                    style="background: #ef4444; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; width: 45%; font-weight: bold;">ยกเลิก</button>
                <button onclick="saveProfile()"
                    style="background: #10b981; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; width: 45%; font-weight: bold;">💾
                    บันทึก</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>

    <script>
        let currentUser = { current_battery: 100, username: 'Guest' };
        let myEV = { brand: 'BYD', model: 'Atto 3 Extended', range_km: 480 };

        try {
            const savedUser = JSON.parse(localStorage.getItem('currentUser'));
            if (savedUser) {
                currentUser = savedUser;
                document.getElementById('display-username').textContent = currentUser.username;
            }
            const savedEV = JSON.parse(localStorage.getItem('myEV'));
            if (savedEV) myEV = savedEV;
        } catch (e) { console.warn("Using default vehicle data"); }

        if (currentUser && myEV) {
            document.getElementById('status-car-name').textContent = `🚗 ${myEV.brand} ${myEV.model}`;
            document.getElementById('status-battery').textContent = `${currentUser.current_battery || 100}%`;
        }

        const map = L.map('map').setView([13.7563, 100.5018], 6);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);

        let userLocation = null;
        let chargeMarkers = [];
        const chargeStopIcon = L.icon({
            iconUrl: 'https://cdn-icons-png.flaticon.com/256/13458/13458710.png',
            iconSize: [60, 60],   // ขนาดความกว้าง x สูง ของไอคอน (ปรับให้เล็กลงได้ เช่น [35, 35])
            iconAnchor: [30, 60],  // จุดศูนย์กลางที่ปักลงบนแผนที่ (ถ้าแก้ iconSize ต้องแก้ตรงนี้ให้เป็นครึ่งนึงของแกน X ด้วย)
            popupAnchor: [0, -60]   // จุดที่กล่องข้อความเด้งขึ้นมา
        });
       // ไอคอนสำหรับกรณีหาปั๊มชาร์จไม่เจอ (หมุดสีแดง/สัญลักษณ์เตือน)
        const warningStopIcon = L.icon({
            iconUrl: 'https://cdn-icons-png.flaticon.com/512/564/564619.png',
            iconSize: [35, 35],
            iconAnchor: [17, 35],
            popupAnchor: [0, -35]
        });
        let routingControl = null;
        let loadedStations = new Set();
        let searchMarker = null;
        let tripOrigin = null;
        let tripDestination = null;

        const markersCluster = L.markerClusterGroup({ chunkedLoading: true, maxClusterRadius: 50 });
        map.addLayer(markersCluster);

        const evIcon = L.divIcon({
            html: `<div style="background-color: #10b981; width: 36px; height: 36px; border-radius: 50%; border: 3px solid white; box-shadow: 0 4px 6px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path></svg></div>`,
            className: 'modern-ev-marker', iconSize: [36, 36], iconAnchor: [18, 18], popupAnchor: [0, -18]
        });

        // --- ฟังก์ชันแสดงแผงสรุปเส้นทางแบบ Timeline ---
        function showRouteSummary(totalDistanceKm, totalTimeMinutes, waypoints) {
            const panel = document.getElementById('route-summary-panel');
            const timelineContainer = document.getElementById('route-timeline');

            document.getElementById('summary-dist').textContent = `${totalDistanceKm} km`;
            const hours = Math.floor(totalTimeMinutes / 60);
            const mins = Math.round(totalTimeMinutes % 60);
            document.getElementById('summary-time').textContent = `${hours}h ${mins}m`;

            document.getElementById('summary-text').textContent = `การเดินทางระยะทางรวม ${totalDistanceKm} กม. วันนี้ขับขี่ปลอดภัยนะครับ!`;

            timelineContainer.innerHTML = '';
            waypoints.forEach(wp => {
                let badgeHtml = '';
                if (wp.type === 'charge') {
                    badgeHtml = `<div style="margin-top: 5px;">
                    <span class="timeline-badge">🔌 +${wp.chargeTimeMins} นาที</span>
                    <span class="timeline-badge" style="background:#f3f4f6; color:#4b5563;">เป้าหมาย: ${wp.targetBattery}%</span>
                </div>`;
                }
                const itemHtml = `<div class="timeline-item ${wp.type}">
                <div style="font-size: 11px; color: #9ca3af; margin-bottom: 2px;">${wp.label}</div>
                <div class="timeline-title">${wp.title}</div>
                <div class="timeline-desc">${wp.desc}</div>
                ${badgeHtml}
            </div>`;
                timelineContainer.insertAdjacentHTML('beforeend', itemHtml);
            });
            panel.classList.remove('hidden');
        }

        // ฟังก์ชันช่วยหาพิกัด LatLng ตามระยะทางจริง (กิโลเมตร) บนแนวเส้นทาง
            function getPointAtDistance(coords, targetKm) {
                let accumulatedMeters = 0;
                const targetMeters = targetKm * 1000;
                for (let i = 0; i < coords.length - 1; i++) {
                    const d = coords[i].distanceTo(coords[i + 1]);
                    if (accumulatedMeters + d >= targetMeters) {
                        return coords[i];
                    }
                    accumulatedMeters += d;
                }
                return coords[coords.length - 1];
            }

            // ฟังก์ชันคำนวณและวางแผนจุดแวะชาร์จตลอดเส้นทาง
            function calculateAndDisplayRoute(destination) {
                if (!userLocation) { alert("ยังไม่พบตำแหน่งเริ่มต้นของคุณ กรุณารอสักครู่"); return; }

                tripOrigin = userLocation;
                tripDestination = destination;

                if (routingControl) map.removeControl(routingControl);

                routingControl = L.Routing.control({
                    waypoints: [tripOrigin, tripDestination],
                    routeWhileDragging: false, addWaypoints: false, show: false,
                    lineOptions: { styles: [{ color: '#3b82f6', opacity: 0.8, weight: 6 }] }
                }).addTo(map);

                routingControl.on('routesfound', async function (event) {
                    const routes = event.routes;
                    const summary = routes[0].summary;
                    const routeCoords = routes[0].coordinates;

                    const totalDistanceKm = parseFloat((summary.totalDistance / 1000).toFixed(1));
                    const timeMinutes = summary.totalTime / 60;

                    // เคลียร์หมุดเดิมออก
                    chargeMarkers.forEach(marker => map.removeLayer(marker));
                    chargeMarkers = [];

                    const currentBatt = currentUser.current_battery || 100;
                    const evRange = myEV.range_km || 480;
                    let currentBatteryKm = evRange * (currentBatt / 100);
                    let timelineWaypoints = [];

                    timelineWaypoints.push({
                        type: 'start', label: 'จุดเริ่มต้น', title: 'ตำแหน่งปัจจุบันของคุณ',
                        desc: `แบตเตอรี่เริ่มต้น ${currentBatt}% (วิ่งได้อีกประมาณ ${Math.round(currentBatteryKm)} กม.)`
                    });

                    if (totalDistanceKm > currentBatteryKm) {
                        const ocmApiKey = 'e2235a72-1320-4010-b9a1-b54cf27381d0';
                        let currentPosKm = 0;
                        let availableKm = currentBatteryKm;
                        let stopCount = 1;

                        // คำนวณทีละช่วงจนกว่าจะถึงจุดหมาย
                        while (currentPosKm + availableKm < totalDistanceKm) {
                            // เผื่อระยะปลอดภัย 60 กม. (ช่วง 50-80 กม. ก่อนแบตหมด)
                            const safeTargetKm = currentPosKm + availableKm - 60;
                            let stationFound = null;

                            // สแกนจากจุดเป้าหมาย และสแกนถอยหลังบนเส้นทาง (-15 กม., -30 กม., -45 กม.)
                            const scanOffsets = [0, -15, -30, -45];
                            for (const offset of scanOffsets) {
                                const scanKm = safeTargetKm + offset;
                                if (scanKm <= currentPosKm) break;

                                const scanPoint = getPointAtDistance(routeCoords, scanKm);
                                try {
                                    // ค้นหาสถานีในรัศมีเบี่ยงออกจากเส้นทางไม่เกิน 30 กม.
                                    const url = `https://api.openchargemap.io/v3/poi?key=${ocmApiKey}&latitude=${scanPoint.lat}&longitude=${scanPoint.lng}&distance=30&distanceunit=KM&maxresults=5`;
                                    const res = await fetch(url);
                                    const data = await res.json();

                                    if (data && data.length > 0) {
                                        stationFound = {
                                            data: data[0],
                                            atKm: Math.round(scanKm)
                                        };
                                        break; // พบสถานีที่เหมาะสมแล้ว ออกจากลูปสแกน
                                    }
                                } catch (err) {
                                    console.error("OCM Fetch error:", err);
                                }
                            }

                            if (stationFound) {
                                const st = stationFound.data;
                                const stLat = st.AddressInfo.Latitude;
                                const stLng = st.AddressInfo.Longitude;
                                const stTitle = st.AddressInfo.Title || 'สถานีชาร์จ EV';
                                const stOperator = st.OperatorInfo ? st.OperatorInfo.Title : 'ไม่ระบุผู้ให้บริการ';

                                // ปักหมุดสถานีจริงลงบนแผนที่
                                const marker = L.marker([stLat, stLng], { icon: chargeStopIcon })
                                    .addTo(map)
                                    .bindPopup(`
                            <div style="text-align: center; font-family: 'Segoe UI', sans-serif;">
                                <b style="color: #eab308; font-size: 16px;">⚡ จุดแวะชาร์จที่ ${stopCount}</b><br>
                                <strong style="color: #1f2937;">${stTitle}</strong><br>
                                <span style="color: #6b7280; font-size: 12px;">ผู้ให้บริการ: ${stOperator}</span><br>
                                <span style="color: #10b981; font-size: 12px;">บนเส้นทางช่วง กม. ที่ ${stationFound.atKm}</span>
                            </div>
                        `);
                                chargeMarkers.push(marker);

                                timelineWaypoints.push({
                                    type: 'charge',
                                    label: `จุดชาร์จที่ ${stopCount}`,
                                    title: `แวะชาร์จที่ ${stTitle}`,
                                    desc: `ผู้ให้บริการ: ${stOperator} (ช่วง กม. ที่ ${stationFound.atKm})`,
                                    chargeTimeMins: 45,
                                    targetBattery: 90
                                });

                                // หลังแวะชาร์จ เติมแบตเป็น 90% และเริ่มคำนวณช่วงถัดไปจากสถานีนี้
                                currentPosKm = stationFound.atKm;
                                availableKm = evRange * 0.90;
                            } else {
                                // --- กรณีไม่พบสถานีชาร์จเลย ---

                                // 1. ดึงพิกัด Lat/Lng บนเส้นทาง ตรงช่วงระยะกิโลเมตรที่แบตจะใกล้หมดพอดี
                                const warningPoint = getPointAtDistance(routeCoords, safeTargetKm);

                                // 2. ปักหมุดแจ้งเตือนบนแผนที่
                                if (warningPoint) {
                                    const marker = L.marker([warningPoint.lat, warningPoint.lng], { icon: warningStopIcon })
                                        .addTo(map)
                                        .bindPopup(`
                                            <div style="text-align: center; font-family: 'Segoe UI', sans-serif;">
                                                <b style="color: #ef4444; font-size: 16px;">⚠️ จุดเตือนแบตเตอรี่ต่ำ</b><br>
                                                <span style="color: #6b7280; font-size: 13px;">ช่วง กม. ที่ ${Math.round(safeTargetKm)}</span><br>
                                                <span style="color: #ef4444; font-size: 12px; font-weight: bold;">ไม่พบสถานีชาร์จในรัศมีโดยรอบ<br>กรุณาวางแผนแวะชาร์จก่อนถึงจุดนี้!</span>
                                            </div>
                                        `);
                                    chargeMarkers.push(marker);
                                }

                                // 3. เพิ่มข้อมูลแจ้งเตือนลงในแผง Timeline ด้านล่าง
                                timelineWaypoints.push({
                                    type: 'charge',
                                    label: `จุดชาร์จที่ ${stopCount}`,
                                    title: `ต้องการแวะชาร์จ (ช่วง กม. ที่ ${Math.round(safeTargetKm)})`,
                                    desc: `<span style="color:#ef4444; font-weight:bold;">⚠️ ไม่พบสถานีชาร์จในรัศมี 30 กม. จากเส้นทาง</span>`,
                                    chargeTimeMins: 45,
                                    targetBattery: 90
                                });

                                currentPosKm = safeTargetKm;
                                availableKm = evRange * 0.90;
                            }
                            stopCount++;
                        }

                        timelineWaypoints.push({
                            type: 'end', label: 'ถึงที่หมาย', title: 'จุดหมายปลายทาง',
                            desc: `เดินทางถึงจุดหมายอย่างปลอดภัยพร้อมใช้งานต่อ`
                        });

                    } else {
                        const percentUsed = (totalDistanceKm / evRange) * 100;
                        const batteryLeft = currentBatt - percentUsed;

                        timelineWaypoints.push({
                            type: 'end', label: 'ถึงที่หมาย', title: 'จุดหมายปลายทาง',
                            desc: `ถึงจุดหมายด้วยแบตเตอรี่ ${batteryLeft.toFixed(1)}%`
                        });
                    }

                    // อัปเดตแผงสรุปข้อมูล Timeline
                    showRouteSummary(totalDistanceKm, timeMinutes, timelineWaypoints);
                });
            }

        // --- ดึงสถานีชาร์จ Bounding Box (อัปเกรดข้อมูลแบบละเอียดสุดๆ) ---
            function fetchStationsInView() {
                const bounds = map.getBounds();
                const s = bounds.getSouth(), n = bounds.getNorth(), w = bounds.getWest(), e = bounds.getEast();
                const ocmApiKey = 'e2235a72-1320-4010-b9a1-b54cf27381d0';

                const ocmUrl = `https://api.openchargemap.io/v3/poi?key=${ocmApiKey}&boundingbox=(${n},${w}),(${s},${e})&maxresults=500`;
                const overpassQuery = `[out:json][timeout:25];(node["amenity"="charging_station"](${s},${w},${n},${e});way["amenity"="charging_station"](${s},${w},${n},${e}););out center;`;

                Promise.all([
                    fetch(ocmUrl).then(res => res.json()).catch(() => []),
                    fetch('https://overpass-api.de/api/interpreter', { method: 'POST', body: overpassQuery }).then(res => res.json()).catch(() => ({ elements: [] }))
                ]).then(([ocmData, osmData]) => {
                    const newMarkers = [];

                    // 1. แกะข้อมูลจาก Open Charge Map (OCM) แบบละเอียด
                    if (Array.isArray(ocmData)) {
                        ocmData.forEach(station => {
                            if (station.AddressInfo && station.AddressInfo.ID) {
                                const id = `ocm_${station.ID || station.AddressInfo.ID}`;
                                if (!loadedStations.has(id)) {
                                    loadedStations.add(id);

                                    // ดึงชื่อสถานีและผู้ให้บริการ
                                    const title = station.AddressInfo.Title || 'สถานีชาร์จ EV';
                                    const operator = station.OperatorInfo ? station.OperatorInfo.Title : 'ไม่ระบุผู้ให้บริการ';

                                    // ข้อมูลการเข้าถึงและค่าบริการ (เหมือนในภาพ)
                                    const usageType = station.UsageType ? station.UsageType.Title : 'ไม่ระบุเงื่อนไขการใช้งาน';
                                    const usageCost = station.UsageCost ? station.UsageCost : 'ไม่ระบุค่าบริการ (Not specified)';

                                    // 💡 สร้างการ์ดรายละเอียดหัวชาร์จ (Connectors & Power)
                                    let connHtml = '<div style="margin-top: 10px; display: flex; flex-direction: column; gap: 8px;">';
                                    if (station.Connections && station.Connections.length > 0) {
                                        station.Connections.forEach(conn => {
                                            const type = conn.ConnectionType ? conn.ConnectionType.Title : 'ไม่ระบุชนิด';
                                            const power = conn.PowerKW ? `${conn.PowerKW} kW` : 'กำลังไฟไม่ระบุ';
                                            const qty = conn.Quantity ? `${conn.Quantity} หัว` : '';
                                            const current = conn.CurrentType ? conn.CurrentType.Title : ''; // ดึงค่า DC หรือ AC
                                            const status = conn.StatusType ? conn.StatusType.Title : 'Operational';

                                            // จัดกล่อง UI ให้คล้ายกับเว็บ OCM
                                            connHtml += `
                                        <div style="background: #ecfdf5; border: 1px solid #a7f3d0; padding: 10px; border-radius: 8px;">
                                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                                                <strong style="color: #065f46; font-size: 13px;">🔌 ${type} ${current ? `<span style="color:#6b7280; font-size:11px;">(${current})</span>` : ''}</strong>
                                                <span style="background: #10b981; color: white; padding: 2px 8px; border-radius: 12px; font-size: 12px; font-weight:bold;">${power}</span>
                                            </div>
                                            <div style="font-size: 11px; color: #047857;">จำนวน: ${qty} | สถานะ: ${status}</div>
                                        </div>`;
                                        });
                                    } else {
                                        connHtml += '<div style="font-size: 12px; color: #9ca3af; text-align: center;">ไม่มีข้อมูลหัวชาร์จ</div>';
                                    }
                                    connHtml += '</div>';

                                    // ประกอบร่าง UI ป๊อปอัป
                                    const popupContent = `
                                    <div style="min-width: 250px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
                                        <h4 style="margin: 0 0 5px 0; color: #10b981; font-size: 15px; border-bottom: 2px solid #ecfdf5; padding-bottom: 5px; line-height: 1.3;">⚡ ${title}</h4>
                                        <div style="font-size: 12px; color: #6b7280; margin-bottom: 4px;">🏢 <b>Operator:</b> ${operator}</div>
                                        <div style="font-size: 11px; color: #6b7280; margin-bottom: 8px;">💳 <b>Access:</b> ${usageType}<br>💰 <b>Cost:</b> ${usageCost}</div>
                                        <div style="font-size: 13px; font-weight: bold; color: #1f2937; margin-top: 10px;">Connectors & power:</div>
                                        ${contentsHtml = connHtml}
                                    </div>
                                `;

                                    const marker = L.marker([station.AddressInfo.Latitude, station.AddressInfo.Longitude], { icon: evIcon })
                                        .bindPopup(popupContent);
                                    newMarkers.push(marker);
                                }
                            }
                        });
                    }

                    // 2. แกะข้อมูลจาก OpenStreetMap (OSM) แบบปรับปรุงการหาชื่อ
                    (osmData.elements || []).forEach(station => {
                        const id = `osm_${station.id}`;
                        if (!loadedStations.has(id)) {
                            const lat = station.lat || (station.center && station.center.lat);
                            const lng = station.lon || (station.center && station.center.lon);
                            if (lat && lng) {
                                loadedStations.add(id);
                                const tags = station.tags || {};

                                // อัปเกรดให้พยายามดึงชื่อจาก tags อื่นๆ ด้วยถ้าไม่มีชื่อตรงๆ
                                let title = tags.name || tags['name:en'] || tags.brand || tags.operator || 'สถานีชาร์จ (ไม่มีชื่อ)';
                                if (title === tags.brand || title === tags.operator) {
                                    title = `สถานีชาร์จ ${title}`;
                                }
                                const operator = tags.operator || tags.brand || 'ไม่ระบุผู้ให้บริการ';

                                let osmConnHtml = '<div style="margin-top: 10px; display: flex; flex-direction: column; gap: 8px;">';
                                let hasConnData = false;

                                if (tags['socket:type2_combo'] || tags['socket:type2'] || tags['socket:chademo']) {
                                    hasConnData = true;
                                    const createOsmBadge = (name, count) => `
                                    <div style="background: #f3f4f6; border: 1px solid #d1d5db; padding: 8px; border-radius: 8px; font-size: 12px; color: #374151;">
                                        🔌 <b>${name}</b>: ${count} หัว
                                    </div>`;

                                    if (tags['socket:type2_combo']) osmConnHtml += createOsmBadge('CCS2 (DC)', tags['socket:type2_combo']);
                                    if (tags['socket:type2']) osmConnHtml += createOsmBadge('Type 2 (AC)', tags['socket:type2']);
                                    if (tags['socket:chademo']) osmConnHtml += createOsmBadge('CHAdeMO', tags['socket:chademo']);
                                }

                                if (!hasConnData) {
                                    osmConnHtml += '<div style="font-size: 12px; color: #9ca3af; text-align: center;">ไม่มีข้อมูลหัวชาร์จเชิงลึก</div>';
                                }
                                osmConnHtml += '</div>';

                                const popupContent = `
                                <div style="min-width: 220px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
                                    <h4 style="margin: 0 0 5px 0; color: #3b82f6; font-size: 14px; border-bottom: 2px solid #eff6ff; padding-bottom: 5px;">📍 ${title} <span style="font-size:10px; color:#9ca3af;">(OSM)</span></h4>
                                    <div style="font-size: 12px; color: #6b7280; margin-bottom: 8px;">🏢 <b>Operator:</b> ${operator}</div>
                                    <div style="font-size: 13px; font-weight: bold; color: #1f2937;">รายละเอียดจากพื้นที่:</div>
                                    ${osmConnHtml}
                                </div>
                            `;

                                const marker = L.marker([lat, lng], { icon: evIcon }).bindPopup(popupContent);
                                newMarkers.push(marker);
                            }
                        }
                    });

                    if (newMarkers.length > 0) markersCluster.addLayers(newMarkers);
                });
            }

                    document.getElementById('edit-model').value = myEV.model || '';

                    document.getElementById('edit-battery').value = currentUser.current_battery || 100;
                }, 50);
            });

            // โหลดข้อมูลทันทีเมื่อเปิดหน้าเว็บ
            loadBrandsToMap();
    </script>
